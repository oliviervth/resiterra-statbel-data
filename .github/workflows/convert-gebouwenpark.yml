name: Convert Gebouwenpark Excel to JSON per gemeente

on:
  workflow_dispatch:

jobs:
  convert:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Convert gebouwenpark per gemeente
        run: python scripts/convert_gebouwenpark_per_gemeente.py

      - name: Commit JSON files
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          git add data/gebouwenpark/
          git commit -m "Update gebouwenpark per gemeente JSON" || echo "No changes"
          git push
